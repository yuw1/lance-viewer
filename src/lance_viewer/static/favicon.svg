<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lance Viewer">
  <title>Lance Viewer</title>
  <!-- Columnar-store mark: three independent columns of unequal height.
       Spacing is tuned so the gaps stay >=1px when downscaled to 16px. -->
  <rect width="32" height="32" rx="7" fill="#4f8cff"/>
  <rect x="5" y="14" width="5" height="12" rx="1.5" fill="#0f1115"/>
  <rect x="13.5" y="8" width="5" height="18" rx="1.5" fill="#0f1115"/>
  <rect x="22" y="17" width="5" height="9" rx="1.5" fill="#0f1115"/>
</svg>